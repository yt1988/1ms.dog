<!doctype html>
<html lang="{{lang}}" data-paths="{{pathsAttr}}"{{rootAttr}}>
<head>
<meta charset="utf-8">
<script>{{prepaint}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{head}}
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/{{css}}">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="{{homeHref}}" aria-label="1ms.dog">
      <img class="logo-light" src="/assets/logo-light.svg" width="90" height="36" alt="1ms">
      <img class="logo-dark" src="/assets/logo-dark.svg" width="90" height="36" alt="1ms">
    </a>
    <div class="top-acts">
      <label class="sel"><span class="sr" data-i="lang_label"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 2.8 4 2.8 6.5S10 12.5 8 14.5C6 12.5 5.2 10.5 5.2 8S6 3.5 8 1.5z"/></svg>
        <select id="lang">{{langOpts}}</select>
      </label>
      <button class="icon-btn" id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="help"><span class="sr" data-i="faq_h"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1v.4M8 11.3v.1"/></svg>
      </button>
      <a class="icon-btn gh" href="https://github.com/yt1988/1ms.dog" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg></a>
      <button class="icon-btn" id="theme" type="button" aria-label="{{a:th_system}}">
        <svg class="i-sys" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
        <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>
        <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="shared" id="shared" hidden><span id="sharedTxt"></span><button class="btn pri" id="testMine" type="button" data-i="test_mine"></button></div>

    <section class="hero card">
      <div class="hero-l">
        <h1>{{h1}}</h1>
        {{intro}}
        <div class="exits" id="exits">
          <div class="ex-h"><span data-i="exit_h"></span><button class="mini" id="eye" type="button" data-i="hide"></button><a class="eg ext" data-tool="egress" target="_blank" rel="noopener" hidden><span data-i="egress_link"></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M12 10v3.5H2.5V4H6"/></svg></a><span class="ex-p" id="exProg" aria-live="polite"></span></div>
          <ul id="exList"><li class="ex sk-row"><span class="sk-t" data-i="sniff"></span></li></ul>
          <p class="ex-note" id="exNote" hidden></p>
          <p class="links" id="exLinks" hidden></p>
        </div>
      </div>
      <div class="stage" id="stage" data-mood="sniff">
        <p class="bubble" id="bubble" aria-live="polite" data-i="mood_sniff"></p>
        <button class="dog" id="dog" type="button" aria-label="{{a:a_pet}}">
          <img src="/assets/shiba-run.svg" width="960" height="540" alt="{{a:a_dog}}" id="dogImg">
          <span class="zzz" aria-hidden="true">z<i>z</i><b>z</b></span>
        </button>
        <span class="ground" aria-hidden="true"></span>
      </div>
      <div class="sum" id="sum">
        <div class="sum-head"><p class="v-h" id="vHead" data-i="sniff"></p><p class="v-d" id="vText">{{waitText}}</p><p class="links" id="vLinks" hidden></p></div>
        <div class="sum-acts">
          <div class="sum-btns">
            <button class="btn pri" id="run" type="button"><span data-i="start"></span></button>
<!--v:full-->
            <button class="btn" id="deep" type="button" data-i="deep"></button>
<!--/v-->
            <button class="btn icon" id="share" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10V2M5 4.5 8 1.5l3 3M3 8v5.5h10V8"/></svg><span class="sr" data-i="share"></span></button>
          </div>
          <label class="auto"><input type="checkbox" id="auto"{{autoOn}}><span class="sw" aria-hidden="true"></span><span data-i="auto_label"></span></label>
        </div>
        <div class="prog" id="prog"><i></i></div>
<!--v:full-->
        <div class="stats">
          <div class="stat" id="stLocal"><em data-i="seg_local"></em><b>–</b><i></i></div>
          <div class="stat" id="stGlobal"><em data-i="seg_global"></em><b>–</b><i></i></div>
          <div class="stat" id="stAll"><em data-i="med"></em><b>–</b><i></i></div>
        </div>
        <div class="uses" id="vUses">{{uses}}</div>
<!--/v-->
<!--v:grp-->
        <div class="stats">
          <div class="stat" id="stMed"><em data-i="one_med"></em><b>–</b><i></i></div>
          <div class="stat" id="stBest"><em data-i="grp_best"></em><b>–</b><i></i></div>
          <div class="stat" id="stWorst"><em data-i="grp_worst"></em><b>–</b><i></i></div>
        </div>
<!--/v-->
<!--v:one-->
        <div class="stats">
          <div class="stat" id="stMed"><em data-i="one_med"></em><b>–</b><i></i></div>
          <div class="stat" id="stCold"><em data-i="one_cold"></em><b>–</b><i></i></div>
          <div class="stat" id="stJit"><em data-i="one_jit"></em><b>–</b><i></i></div>
        </div>
        <div class="slane" id="slane" aria-hidden="true"><span class="trk"></span><span class="dots" id="dots"></span></div>
<!--/v-->
      </div>
    </section>

<!--v:full,grp,sub-->
    <section class="field card" aria-label="{{a:a_field}}">
      <div class="axis" aria-hidden="true">{{axis}}</div>
      <div class="groups" id="groups">
{{groups}}
      </div>
    </section>
<!--/v-->
<!--v:full-->
    <section class="cli card">
      <svg class="cli-ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6.5l2 1.5-2 1.5M8.5 10h3"/></svg>
      <div class="cli-t"><h2 data-i="cli_h"></h2><p data-i="cli_sub"></p></div>
      <div class="cli-cmd"><div class="cmdline"><code>{{cliCmd}}</code><button class="btn sm" type="button" data-copy data-i="copy"></button></div>
        <div class="cli-links"><button class="lnk" type="button" data-cli aria-haspopup="dialog" aria-controls="cli" data-i="cli_more"></button><a class="cli-gh" href="https://github.com/yt1988/https-latency-test-cli" target="_blank" rel="noopener noreferrer"><svg class="gh-ic" viewBox="0 0 16 16" aria-hidden="true"><path id="ghMark" d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg>GitHub<svg class="ext" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M12 10v3.5H2.5V4H6"/></svg></a></div></div>
    </section>
<!--/v-->
<!--v:one,grp-->
    <a class="cta card" href="{{homeHref}}"><span><b data-i="cta_h"></b><i data-i="cta_d"></i></span><span class="btn pri" data-i="cta_btn"></span></a>
<!--/v-->
  </main>

  <footer class="foot">
    <nav class="sitemap" aria-label="{{a:a_nav}}">{{sitemap}}</nav>
    <div class="foot-l"><span data-i="foot"></span><span>© 1ms.dog</span></div>
  </footer>
</div>

<div class="scrim" id="help" hidden>
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="helpT">
    <div class="dlg-h"><h2 id="helpT" data-i="faq_h"></h2>
      <button class="icon-btn" data-close type="button" aria-label="{{a:a_close}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="help-b">
      <nav class="help-nav" id="helpNav" role="tablist">{{helpNav}}</nav>
      <div class="help-pick">
        <button class="icon-btn" type="button" data-hstep="-1" aria-label="{{a:a_prev}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg></button>
        <select id="helpSel" aria-labelledby="helpT"></select>
        <button class="icon-btn" type="button" data-hstep="1" aria-label="{{a:a_next}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg></button>
      </div>
      <div class="help-c" id="helpC">{{helpC}}</div>
    </div>
  </div>
</div>

<!--v:full-->
<div class="scrim" id="cli" hidden>
  <div class="dialog cli-dlg" role="dialog" aria-modal="true" aria-labelledby="cliT">
    <div class="dlg-h"><div><h2 id="cliT"><span data-i="cli_h"></span><a class="gh-link" href="https://github.com/yt1988/https-latency-test-cli" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><svg class="gh-ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#ghMark"/></svg></a></h2><p class="note" data-i="cli_sub"></p></div>
      <button class="icon-btn" data-close type="button" aria-label="{{a:a_close}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="dlg-b" id="cliB"></div>
  </div>
</div>
<!--/v-->

<script type="application/json" id="data">{{data}}</script>
<script src="/assets/{{strings}}" defer></script>
<script src="/assets/{{js}}" defer></script>
</body>
</html>
